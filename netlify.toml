[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["captures/*.har"]

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "clipboard-read=(self), clipboard-write=(self)"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
